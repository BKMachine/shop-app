# BK Machine public website. Static files only; see Dockerfile.bkmachine.net at the repo root.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Log the real client IP when behind Nginx Proxy Manager, trusting
    # forwarded headers only from private (Docker/LAN) addresses.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    server_tokens off;
    # Relative redirects, so the container port never leaks behind a reverse proxy.
    absolute_redirect off;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript image/svg+xml;

    # `expires` (not add_header) sets Cache-Control below, so these headers are
    # inherited by every location.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Pages from the old Squarespace site, pointed at their new sections.
    location ~ ^/(services|services1|swiss|lathe|milling)/?$ {
        return 301 /#capabilities;
    }
    location ~ ^/contactus/?$ {
        return 301 /#contact;
    }

    # Asset filenames aren't content-hashed, so keep caching moderate.
    location ~* \.(?:css|js)$ {
        expires 1h;
    }
    location ~* \.(?:png|jpe?g|svg|ico|woff2)$ {
        expires 30d;
        access_log off;
    }

    location / {
        try_files $uri $uri/ =404;
        expires -1;
    }
}
