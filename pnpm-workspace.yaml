packages:
  - apps/*
  - packages/*

# Deploy (pnpm deploy) copies workspace packages instead of symlinking them.
injectWorkspacePackages: true

overrides:
  # pdf-parse pins pdfjs-dist 5.4.296 while the server depends on 5.7.284,
  # which shipped ~32MB of duplicate pdfjs in the production image. Both use
  # only the legacy/build/pdf.mjs entry, so a single version serves both.
  pdfjs-dist: ^5.7.284

allowBuilds:
  # Optional jest watch-mode dependency; it ships prebuilt binaries, so no build is needed.
  '@parcel/watcher': false
  esbuild: true
  onnxruntime-node: false
  protobufjs: true
  unrs-resolver: true

ignoredBuiltDependencies:
  - '@parcel/watcher'
  - onnxruntime-node

onlyBuiltDependencies:
  - esbuild
  - protobufjs
  - unrs-resolver
